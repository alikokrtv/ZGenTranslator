{% extends "base.html" %}

{% block title %}Giriş Yap - Z Kuşağı Translator{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Giriş Yap</h1>
    <p>Z Kuşağı Translator'a hoş geldin!</p>
    
    {% if messages %}
        {% for message in messages %}
            <div class="notification show {{ message.category }}">
                <div class="notification-content">
                    <p class="notification-message">{{ message }}</p>
                </div>
            </div>
        {% endfor %}
    {% endif %}
    
    <form id="login-form" method="post" action="{{ url_for('login') }}" novalidate>
        <div class="form-group">
            <label for="username">Kullanıcı Adı <span class="required">*</span></label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Şifre <span class="required">*</span></label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <div class="auth-action">
            <div class="auth-links">
                <p>Hesabın yok mu? <a href="{{ url_for('register') }}">Kayıt Ol</a></p>
            </div>
            <button type="submit" class="primary-btn" id="login-submit-btn">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </button>
        </div>
    </form>
</div>

<script>
// Ensure the form submits correctly
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-submit-btn');
    
    if (loginForm && loginBtn) {
        loginBtn.addEventListener('click', function(e) {
            e.preventDefault();
            loginForm.submit();
        });
        
        loginForm.addEventListener('submit', function(e) {
            // Let the normal form submission occur, but ensure proper form data is sent
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                e.preventDefault();
                alert('Kullanıcı adı ve şifre gereklidir.');
                return false;
            }
        });
    }
});
</script>
{% endblock %}
