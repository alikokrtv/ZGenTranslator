{% extends "layout.html" %}

{% block title %}Giriş Yap - Z Kuşağı Translator{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Giriş Yap</h1>
    <p>Z Kuşağı Translator'a hoş geldin!</p>
    
    {% if messages %}
        {% for message in messages %}
            <div class="notification show {{ message.category }}">
                <div class="notification-content">
                    <p class="notification-message">{{ message }}</p>
                </div>
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="post" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Kullanıcı Adı <span class="required">*</span></label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Şifre <span class="required">*</span></label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <div class="auth-action">
            <div class="auth-links">
                <p>Hesabın yok mu? <a href="{{ url_for('register') }}">Kayıt Ol</a></p>
            </div>
            <button type="submit" class="primary-btn">
                <i class="fas fa-sign-in-alt"></i> Giriş Yap
            </button>
        </div>
    </form>
</div>
{% endblock %}
