{% extends 'base.html' %}

{% block title %}Hata{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Bir Hata Oluştu</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    <p>Bu hata kaydedildi ve en kısa sürede çözülecektir.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('index') }}" class="btn btn-primary">Ana Sayfaya Dön</a>
                        {% if 'user_id' in session %}
                            <a href="{{ url_for('profile') }}" class="btn btn-secondary">Profilime Dön</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
